sonar.organization=mstne03
sonar.projectKey=mstne03_sophisnavi-project
sonar.projectName=sophisnavi-project

# SonarCloud analiza todo el repo y detecta los tests automáticamente:
# sonar.sources / sonar.tests / sonar.test.inclusions ya no tienen efecto (aviso del scanner).

# Cobertura generada por el job unit (vitest --coverage, reporter lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura (ADR-0006):
# - las mismas que coverageExclusions en vitest.config.ts;
# - además, lo que Vitest nunca ejecuta porque está fuera de src/: configuración de la raíz y tests E2E.
sonar.coverage.exclusions=src/ui/tree-scene/renderer.ts,src/ui/tree-scene/shaders.ts,data/content/**,scripts/**,**/*.test.ts,**/*.test.tsx,e2e/**,*.config.ts,*.config.mjs,*.config.cjs,vitest.setup.ts,lighthouserc.cjs

# El job falla si el quality gate falla.
sonar.qualitygate.wait=true
