sonar.organization=mstne03
sonar.projectKey=mstne03_sophisnavi-project
sonar.projectName=sophisnavi-project

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=data/seed/**

# Cobertura generada por el job unit (vitest --coverage, reporter lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Misma lista que coverageExclusions en vitest.config.ts (ADR-0006).
sonar.coverage.exclusions=src/lib/tree-scene.ts,data/seed/**,**/*.test.ts,**/*.test.tsx

# El job falla si el quality gate falla.
sonar.qualitygate.wait=true
